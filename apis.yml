  detail: >-
    Ohio State turned out to operate more than the June 2026 profile credited it with, and less of
    what it was credited with is actually its own. Two institution-operated public APIs were found
    and verified this run and neither was previously catalogued: the OSU Mobile Content API v2 at
    content.osu.edu/v2 (class search and campus events, entirely unauthenticated, no published
    documentation — the paths were read out of the classes.osu.edu client bundle and then probed)
    and the CHRR CKAN 2.10.10 open data portal at data.chrr.ohio-state.edu. Ohio State's own
    Shibboleth SAML IdP was confirmed in InCommon metadata. Against that, the Knowledge Bank
    surfaces already in this profile were re-graded from institution to tenant: kb.osu.edu is an
    Ohio State hostname that CNAMEs to osu-prod.cname.atmire.com, so DSpace and its hosting are
    Atmire's engineering and only the repository content is Ohio State's. Library discovery
    (search.library.osu.edu CNAME to primo.exlibrisgroup.com) and the LMS (osu.instructure.com) are
    tenancies added this run for completeness. No pricing, rate limit, status page, terms of service
    or support channel exists for any Ohio State API, because Ohio State does not run an API
    programme — it runs a handful of services that happen to answer in JSON.
