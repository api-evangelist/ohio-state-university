apis:
  - aid: ohio-state-university:mobile-content-api
    name: Ohio State Mobile Content API v2
    x-operator: institution
    x-operator-basis: >-
      content.osu.edu is on Ohio State's own registrable domain and CNAMEs to
      WH-prdosuedu132-VIP.it.ohio-state.edu (140.254.112.132), Ohio State's own address space. No
      vendor identity appears in the service root, the response envelopes or the DNS chain.
    description: >-
      Public, unauthenticated, read-only JSON API operated by Ohio State's Office of Technology and
      Digital Innovation. Serves academic term lists, full-text class search against Student
      Information System data, and the public campus events feed. It is the backend behind the
      public class search at classes.osu.edu and it names itself "OSU Mobile API v2" at its root.
      Ohio State publishes no documentation and no specification for it; the OpenAPI carried here
      was DERIVED from the published client bundle and live probes on 2026-09-01, and verified at
      1,033 courses for Autumn 2026 and 153 campus events.
    humanURL: https://classes.osu.edu/
    baseURL: https://content.osu.edu/v2
    tags: [ Course Catalog, Class Search, Events, Campus Life, Student Information System, REST ]
    properties:
      - type: OpenAPI
        url: openapi/ohio-state-university-mobile-content-api-openapi.yml
      - type: Examples
