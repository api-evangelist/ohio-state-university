description: >-
  The Ohio State University is a large public land-grant research university in Columbus, Ohio,
  United States. It operates no central developer portal and publishes no OpenAPI, no API key
  programme and no developer documentation for any of its surfaces. What it does operate, verified
  live on 2026-09-01, is a small set of genuinely institution-run programmable surfaces: an
  unauthenticated JSON class-search and campus-events API at content.osu.edu/v2 that identifies
  itself as "OSU Mobile API v2" and backs the public class search at classes.osu.edu; a CKAN 2.10.10
  open data portal at data.chrr.ohio-state.edu run by the Center for Human Resource Research, which
  mints its own DataCite DOIs under prefix 10.82271; and an institution-wide Shibboleth SAML 2.0
  Identity Provider published in the InCommon Federation under entityID urn:mace:incommon:osu.edu
  with REFEDS Research and Scholarship and SIRTFI assurance. Everything else that looks like an Ohio
  State API is a vendor platform running under an Ohio State name: the Knowledge Bank repository is
  DSpace hosted by Atmire, library discovery is Ex Libris Primo, and the LMS is Instructure Canvas.
  Those tenancies are recorded here as relationships, not as Ohio State contracts.
