name: Ohio State University authentication
description: >-
  How each Ohio State surface in this profile is authenticated. Two very different postures sit
  side by side: a small number of genuinely open, unauthenticated read APIs, and an
  institution-wide SAML/Shibboleth Single Sign-On that gates everything else. There is no API key
  programme, no developer registration, and no published OAuth client onboarding for any Ohio
  State surface found in this run.
